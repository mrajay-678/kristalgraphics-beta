<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0&icon_names=location_on" />
		<title>Kristal Graphics - Coming Soon</title>
		<style>
			body {
				display: flex;
				justify-content: center;
				flex-direction: column;
				align-items: center;
				margin: auto 0;
				height: 100vh;
				color: white;
				font-family: "Outfit", sans-serif;
				font-size: 18px;
				font-weight: 200;
				background-image: url("/pattern.png");
				background-size: cover;
				background-repeat: no-repeat;
				line-height: 2;
				padding: 0 30px;
			}

			.coming-soon {
				text-align: center;
				position: relative;
			}

			.circle {
				width: 80px;
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
			}

			.rotate {
				animation: rotate 20s linear infinite;
				width: 300px;
			}

			a {
				color: white;
				text-decoration: none;
			}

			.detail {
				text-align: center;
				margin-top: 20px;
			}

			.detail .flex {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
			}
			.flex img {
				vertical-align: middle;
			}

			@keyframes rotate {
				from {
					transform: rotate(0deg);
				}

				to {
					transform: rotate(360deg);
				}
			}

			@media (max-width: 1000px) {
				body {
					height: 100vh;
				}

				.flex-block {
					flex-direction: column;
				}
			}
		</style>
	</head>

	<body class="bg-black">
		<div>
			<div class="coming-soon">
				<img src="./logo.png" alt="Kristal Graphics Logo" class="circle" />
				<img src="./circle.png" alt="Kristal Graphics Logo" class="rotate" />
			</div>
			<div class="detail">
				<div class="flex">
					<div><img src="/location_on.svg" alt="Location Icon" /> : 9607 Canoga Ave, Chatsworth, CA 91311, United States</div>
				</div>
				<div class="flex flex-block">
					<div class="flex"><img src="/phone_in_talk.svg" alt="Phone Icon" /> : <a href="tel:+18183427822">+1 (818) 342-7822</a> |</div>
					<div class="flex"><img src="/email.svg" alt="Email Icon" /> : <a href="mailto:info@kristalgraphics.net">info@kristalgraphics.net</a></div>
				</div>
			</div>
		</div>
	</body>
</html>
