<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kristal Graphics - Coming Soon</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 1rem;
            background-image: url('/pattern.png');
            background-size: cover;
            background-repeat: no-repeat;
            line-height: 2;
        }
        .coming-soon {
            text-align: center;
            position: relative;
        }
        .circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .rotate {
            animation: rotate 20s linear infinite;
            width: 300px;
        }
        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="bg-black">
    <div class="coming-soon">
        <img src="./logo.png" alt="Kristal Graphics Logo" width="100" height="150" class="circle">
        <img src="./circle.png" alt="Kristal Graphics Logo" class="rotate">
    </div>
    <div>
        Address :- 9607 Canoga Ave, Chatsworth, CA 91311, United States <br>
        Phone :- +1 818-998-8888 <br>
        Email :- info@kristalgraphics.net
    </div>
</body>

</html>
